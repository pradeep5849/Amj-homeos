name: One-time dependency remediation
on:
  push:
    branches: [security/dependency-audit-remediation]
    paths: [.github/workflows/dependency-remediation.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    if: github.ref == 'refs/heads/security/dependency-audit-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Upgrade vulnerable packages and regenerate lockfile
        run: |
          npm install --save-exact next@16.4.2 eslint-config-next@16.4.2
          npm audit fix
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
      - name: Commit dependency updates to remediation branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): upgrade vulnerable npm dependency tree"
            git push origin HEAD:security/dependency-audit-remediation
          fi
