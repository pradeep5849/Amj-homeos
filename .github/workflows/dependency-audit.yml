name: Dependency security audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit runtime dependencies (high and critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies (high and critical, narrowly scoped dev exception)
        run: node scripts/audit-dev-exception.mjs
